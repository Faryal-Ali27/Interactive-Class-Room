<!doctype html>
<html lang="en" data-theme="light">
<head>
  <title>ClassPulse – Live classroom engagement</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ClassPulse – live polls, quizzes, anonymous Q&A and instant feedback for your classroom.">
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/icons.js"></script>
  <script src="/js/theme.js"></script>
  <style>
    .home-wrap { min-height: 100vh; display: flex; flex-direction: column; }
    .home-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px 80px;
    }
    .home-hero img { width: 80px; height: 80px; margin-bottom: 24px; }
    .home-hero h1 { font-size: 36px; font-weight: 800; margin-bottom: 12px; letter-spacing: -.03em; }
    .home-hero p { font-size: 16px; color: var(--mute); max-width: 380px; margin: 0 auto 32px; line-height: 1.6; }
    .home-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 360px; }
    .home-btns a { flex: 1; min-width: 140px; display: block; }
    .home-btns button { width: 100%; padding: 14px 20px; font-size: 15px; justify-content: center; }
    .home-features { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 40px; }
    .home-feature { font-size: 13px; color: var(--mute); display: flex; align-items: center; gap: 5px; }
    .home-feature .ico { color: var(--brand); }
  </style>
</head>
<body>
<div class="home-wrap">
  <header class="top">
    <a class="brand" href="/"><img src="/img/logo.svg" alt="">Class<span>Pulse</span></a>
    <button class="icon" id="themeBtn" aria-label="Toggle theme"></button>
  </header>
  <main class="home-hero">
    <img src="/img/logo.svg" alt="ClassPulse logo">
    <h1>Every student gets a voice</h1>
    <p>Live polls, quizzes, anonymous Q&amp;A and instant feedback for your classroom — no app needed.</p>
    <div class="home-btns">
      <a href="/teacher"><button><i data-ic="layout-dashboard" data-s="16"></i>I'm a teacher</button></a>
      <a href="/student"><button class="ghost"><i data-ic="users" data-s="16"></i>I'm a student</button></a>
    </div>
    <div class="home-features">
      <span class="home-feature"><i data-ic="zap" data-s="14"></i>Real-time results</span>
      <span class="home-feature"><i data-ic="message-square" data-s="14"></i>Anonymous Q&amp;A</span>
      <span class="home-feature"><i data-ic="trophy" data-s="14"></i>Leaderboard</span>
      <span class="home-feature"><i data-ic="activity" data-s="14"></i>Live pace feedback</span>
    </div>
  </main>
</div>
</body>
</html>
